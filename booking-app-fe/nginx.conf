server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy Swagger UI va OpenAPI spec tu BE (localhost:8080)
    # de /swagger, /openapi.json, /webjars chay duoc tren :3001
    location /swagger/ {
        proxy_pass http://be:8080/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /openapi.json {
        proxy_pass http://be:8080/openapi.json;
        proxy_set_header Host $host;
    }
    location /webjars/ {
        proxy_pass http://be:8080/webjars/;
        proxy_set_header Host $host;
    }

    # TOAN BO API di qua nginx -> same-origin, khong bao gio phy thuoc
    # CORS cung khong can biet IP may nao dang chay docker.
    # FE goi "/api/..." tuong doi (VITE_API_BASE_URL = "" trong compose).
    location /api/ {
        proxy_pass http://be:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100m; # upload anh/video phong qua /api/rooms/*/media
    }
    location = /login {
        proxy_pass http://be:8080; # LoginServlet legacy
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
