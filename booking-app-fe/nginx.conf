server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy Swagger UI va OpenAPI spec tu BE (localhost:8080)
    # de /swagger, /openapi.json, /webjars chay duoc tren :3001
    location /swagger/ {
        proxy_pass http://be:8080/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /openapi.json {
        proxy_pass http://be:8080/openapi.json;
        proxy_set_header Host $host;
    }
    location /webjars/ {
        proxy_pass http://be:8080/webjars/;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
