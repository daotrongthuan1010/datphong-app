<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VIVU Booking API — Swagger</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/webjars/swagger-ui/5.17.14/swagger-ui.css" />
  <style>
    body { margin: 0; }
    .topbar { display: none; }
    #swagger-ui .opblock-tag { font-size: 15px; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="/webjars/swagger-ui/5.17.14/swagger-ui-bundle.js"></script>
  <script src="/webjars/swagger-ui/5.17.14/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
        deepLinking: true,
        persistAuthorization: true,
        tryItOutEnabled: true,
        validatorUrl: null,
        // Pre-fill server so Try it out works in docker (BE at 8080).
        // User can still pick localhost:8080 vs actual host in servers dropdown.
        docExpansion: "list",
        defaultModelsExpandDepth: 1
      });
    };
  </script>
</body>
</html>
