app.page.default-size=20
app.page.max-size=100

# --- TOTP 2FA bat buoc moi lan dang nhap (module dev.samstevens.totp) ---
# Dung TotpUtil + AuthServiceImpl: sinh QR, verify ma 6 so (RFC 6238).
twofactor.issuer=VIVU Booking
twofactor.digits=6
twofactor.period-seconds=30
twofactor.window-steps=1
twofactor.secret-length=32
twofactor.qr-image-size=260
# Phieu loginToken (buoc 2 cua dang nhap) - TTL ngan, luu Redis auth:2fa:login:*
twofactor.login-token-ttl-seconds=300
twofactor.login-max-attempts=5

# --- Dat phong chong double-booking (BookingServiceImpl / RedisLockUtil / HoldExpireScheduler) ---
# Thoi gian giu cho HOLD: user giu phong 15 phut de thanh toan, het han job tra lich ve AVAILABLE.
booking.hold-minutes=15
# TTL khoa Redis theo phong (giay) - phai lon hon thoi gian mot transaction tao booking,
# neu ngan hon thi khoa het han khi tx chua xong = request khac lot vao.
booking.lock-ttl-seconds=10
# Cho gianh lock toi da (ms) - de chiu dung bam dup nut, khong phai cho hang dai.
booking.lock-wait-millis=1500
# So HOLD toi da mot luot quat cua scheduler.
booking.expire-batch-size=100

# --- Thanh toan (PaymentServiceImpl + payment.gateway/*) ---
# fakebank  = fake-bank da cai tren 103.216.117.40 (api :8082, checkout UI :5173) — khong the that
# vnpay     = sandbox.vnpayment.vn (can VNPAY_TMN_CODE + VNPAY_HASH_SECRET trong moi truong)
payment.gateway=fakebank
# BE goi bang HTTP internal (docker network) hoac public. Mac dinh local docker co the fail,
# nen doi thanh http://103.216.117.40:8082 khi BE chay ngoai compose hoac may local.
payment.fakebank.base-url=http://103.216.117.40:8082
payment.fakebank.merchant-id=vivu-booking
# card_success (mac dinh) | card_declined | delayed_success | timeout | duplicate_webhook | provider_error
payment.fakebank.scenario=card_success
# Webhook cong goi ve day. De TRONG de BE tu suy ra tu returnUrl (do docker/lan khong goi duoc
# may local — dung polling GET /api/payments/by-booking/{bookingId} thay the).
payment.webhook-base=
# Only used when payment.gateway=vnpay
payment.vnpay.expire-minutes=30

# --- Bao cao + matview (ReportDao / RevenueService / RevenueRefreshScheduler) ---
# View/matview/function tu tao luc start (qua SqlScriptRunner -> /db/revenue-objects.sql).
db.report-objects.auto-create=true
report.refresh-interval-minutes=15
report.cache-ttl-seconds=60
